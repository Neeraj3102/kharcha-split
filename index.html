<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KharchaSplit" />
    <meta name="application-name" content="KharchaSplit" />
    <meta name="format-detection" content="telephone=no" />
    <title>KharchaSplit — Indian Flatmate Expense Splitter & UPI Settle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
      /* Suppress Netlify injected floating badge and any edge iframes */
      iframe,
      [id*="netlify"],
      [class*="netlify"],
      [data-netlify-badge],
      div[class*="netlify-badge"],
      div[id*="netlify-badge"],
      netlify-badge,
      div[style*="z-index: 2147483647"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
      }
    </style>
    <script>
      (function() {
        function removeNetlifyElements() {
          try {
            var iframes = document.querySelectorAll('iframe');
            for (var j = 0; j < iframes.length; j++) {
              iframes[j].remove();
            }

            var bodyChildren = document.body ? document.body.children : [];
            for (var k = 0; k < bodyChildren.length; k++) {
              var child = bodyChildren[k];
              if (child && child.id !== 'root' && child.tagName !== 'SCRIPT' && child.tagName !== 'STYLE') {
                child.style.display = 'none';
                child.remove();
              }
            }
          } catch(e) {}
        }
        setInterval(removeNetlifyElements, 250);
        window.addEventListener('DOMContentLoaded', removeNetlifyElements);
      })();

      // PWA Service Worker Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('KharchaSplit PWA ServiceWorker active:', reg.scope);
            })
            .catch(function(err) {
              console.warn('KharchaSplit PWA ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body class="bg-[#08080a] text-zinc-100 min-h-screen selection:bg-rose-500 selection:text-white subpixel-antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
