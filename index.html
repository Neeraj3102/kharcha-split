<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff003b'><path d='M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KharchaSplit" />
    <meta name="format-detection" content="telephone=no" />
    <title>KharchaSplit — Indian Flatmate Expense Splitter & UPI Settle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
      /* Suppress Netlify injected floating badge */
      [id*="netlify"],
      [class*="netlify"],
      [data-netlify-badge],
      iframe[src*="netlify"],
      div[class*="netlify-badge"],
      div[id*="netlify-badge"],
      netlify-badge,
      div[style*="z-index: 2147483647"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (function() {
        function removeNetlifyBadge() {
          try {
            document.querySelectorAll('*').forEach(function(el) {
              if (el.id === 'root') return;
              var text = (el.innerText || el.textContent || '').trim();
              if (text === 'Powered by Netlify' || (text.indexOf('Powered by Netlify') !== -1 && text.length < 50)) {
                var p = el;
                while (p.parentElement && p.parentElement !== document.body) {
                  p = p.parentElement;
                }
                if (p && p !== document.body && p.id !== 'root') {
                  p.style.display = 'none';
                  p.remove();
                }
              }
            });
            document.querySelectorAll('body > *:not(#root):not(script):not(style)').forEach(function(node) {
              if ((node.textContent || '').indexOf('Netlify') !== -1) {
                node.style.display = 'none';
                node.remove();
              }
            });
          } catch(e) {}
        }
        setInterval(removeNetlifyBadge, 350);
        window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
      })();
    </script>
  </head>
  <body class="bg-[#08080a] text-zinc-100 min-h-screen selection:bg-rose-500 selection:text-white antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
